apis:
- name: Firstrade Account Data API (via Plaid)
  description: >-
    Access to Firstrade account data is available through the Plaid financial data aggregation platform.
    Plaid supports four product categories for Firstrade: Assets (consolidated balance summaries and asset
    reports), Balance (current and available account balances), Transactions (up to 24 months of transaction
    history), and Investments (retirement, brokerage, and crypto holdings). Authentication is handled
    via Plaid Link — Firstrade customers connect their accounts through Plaid's consent-based flow. Data
    is returned in JSON format through Plaid's standard endpoints. Geographic coverage is United States
    only.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
